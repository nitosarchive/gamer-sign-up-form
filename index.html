<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <header>
      <img src="./assets/images/logo.svg" alt="logo-neoncore" />
      <div class="checklist incomplete">
        <span id="currentCheck">0</span><span>/5 ready</span>
      </div>
    </header>
    <section>
      <h1>
        <span class="backslash">//</span>
        join the nexus
      </h1>

      <span class="init">initialize your neoncore identity</span>
      <div class="divider"></div>
      <div class="bottom-section">
        <span>operator id</span><span id="name">unassigned</span>
      </div>
    </section>
    <form action="" method="get" id="signForm">
      <span class="edge-top"></span>
      <span class="edge-bottom"></span>
      <div class="top-wrapper">
        <span>New operator</span><span> all required</span>
      </div>
      <div class="divider"></div>

      <div class="form-container">
        <div>
          <div class="form-title">
            <span class="arrow">></span>
            <span>callsign</span>
          </div>
          <input id="userInput" type="text" placeholder="e.g. Vortext_07" />
          <span id="user-validity"
            >3-20 characters: letters, numbers, _ or -</span
          >
        </div>
        <div>
          <div class="form-title">
            <span class="arrow">></span>
            <span>email</span>
          </div>
          <input type="text" placeholder="you@example.com" />
        </div>
        <div>
          <div class="form-title">
            <span class="arrow">></span>
            <span>password</span>
          </div>
          <input type="text" />
          <div id="strength">
            <span></span><span></span><span></span><span></span>
          </div>
          <span>at least 8 characters</span>
        </div>
        <div>
          <div class="form-title">
            <span class="arrow">></span>
            <span>confirm password</span>
          </div>
          <input type="text" />
        </div>
      </div>

      <div class="terms-wrapper">
        <input
          type="checkbox"
          id="termsCheck"
          name="checkbox"
          value="terms and services"
        />
        <label for="termsCheck">
          I accept the <a href="#">terms</a> and
          <a href="#">privacy policy</a>.</label
        >

        <a href="#"></a>
      </div>

      <button>Initialize account</button>
      <div class="login-section">
        <span>Already an operator?</span>
        <a href="#">Log in</a>
      </div>
    </form>
  </body>
</html>
